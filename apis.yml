name: Doelz Networks
description: 'Doelz Networks Inc. was a data communications networking company headquartered
  at 9501 Jeronimo Road, Irvine, California. It developed data communication networks
  designed to be independent of media, speed, attached devices, or protocols, applied
  across both local area networks (LANs) and wide area networks (WANs), with additional
  locations in Columbia, Maryland and New Jersey. The company raised roughly $16.9
  million from investors including Battery Ventures, Accel, J.H. Whitney, Citi Venture
  Capital International and Brentwood, and was bought out by its management together
  with a group of European investors in 1988. The company has since been acquired
  and is no longer operating: enrichment probes in July 2026 found no live corporate
  domain, no developer portal, no documentation, and no API surface of any kind. This
  profile is retained as a historical record of a venture-backed networking vendor
  and is not expected to yield API artifacts.'
